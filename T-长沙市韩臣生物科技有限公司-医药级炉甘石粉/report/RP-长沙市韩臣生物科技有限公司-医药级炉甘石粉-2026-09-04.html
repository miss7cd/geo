<script src="https://unpkg.com/@antv/g2/dist/g2.min.js"></script>
<script>
/* ============================================================
 * GEO 项目报告模板渲染库（由 template/project.html 提供）
 * 依赖：@antv/g2（UMD 全局 G2）。数据来源：window.__REPORT__。
 * 本段可被跨项目总览（PORTFOLIO）抽取复用，保证单项目报告与
 * 总览内嵌项目面板使用同一套布局/样式/图表逻辑。
 * ============================================================ */
function esc(s){
  if(s===null||s===undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* 将 G2 图表 payload（纯 JSON 数据）转换为 G2 spec。
 * payload.kind: 'line' | 'barV' | 'barH'
 * - line:   { dates:[], series:[{name,color,values:[]}] }
 * - barV:   { items:[{label,value,color}] }   竖向柱状（按标签着色）
 * - barH:   { items:[{label,value}] }         横向柱状（统一主色） */
function buildG2Spec(c){
  if(c.kind==='line'){
    var data=[];
    for(var s=0;s<c.series.length;s++){
      var ser=c.series[s];
      for(var i=0;i<c.dates.length;i++){
        var v=ser.values[i];
        if(v!==null && v!==undefined) data.push({date:c.dates[i], value:v, type:ser.name});
      }
    }
    var colors=c.series.map(function(s){return s.color;});
    return {type:'line', data:data, encode:{x:'date',y:'value',color:'type'},
      scale:{y:{domainMin:0,domainMax:100}, color:{range:colors}},
      axis:{y:{labelFormatter:function(v){return v+'%';}}, x:{labelFormatter:function(d){return String(d).slice(5);}}},
      legend:{color:{position:'top'}}};
  }
  if(c.kind==='barV'){
    var items=c.items.map(function(it){return {label:it.label, value:it.value, color:it.color};});
    var colors=c.items.map(function(it){return it.color;});
    return {type:'interval', data:items, encode:{x:'label',y:'value',color:'label'},
      scale:{y:{domainMin:0,domainMax:100}, color:{range:colors}},
      axis:{y:{labelFormatter:function(v){return v+'%';}}, x:{labelFontSize:11}}, legend:false};
  }
  if(c.kind==='barH'){
    var items2=c.items.map(function(it){return {label:String(it.label), value:it.value};});
    return {type:'interval', data:items2, encode:{x:'label',y:'value'},
      coordinate:{transform:[{type:'transpose'}]}, scale:{x:{padding:0.25}},
      style:{fill:'#2563eb', radiusTopLeft:3, radiusTopRight:3}, axis:{x:{title:false, labelFontSize:11}}};
  }
  return {type:'interval', data:[]};
}

function renderChart(c, el){
  if(!el) return;
  if(typeof G2==='undefined'){
    el.innerHTML='<p class="note">图表库（G2）加载失败：需联网加载 CDN。</p>'; return;
  }
  try{
    var chart=new G2.Chart({container:el, autoFit:true});
    chart.options(buildG2Spec(c));
    chart.render();
  }catch(e){
    el.innerHTML='<p class="note">图表渲染失败：'+esc(e.message)+'</p>';
  }
}

function tableHTML(head, rows){
  var h='<table><tr>'+head.map(function(c){return '<th>'+c+'</th>';}).join('')+'</tr>';
  for(var i=0;i<rows.length;i++){ h+='<tr>'+rows[i].join('')+'</tr>'; }
  return h+'</table>';
}

/* 发布与收录分析小节（结构化数据 → HTML） */
function renderPublish(p){
  if(!p.hasData) return '<h3>发布与收录分析</h3><p class="note">未找到发布流水账（article/*/strategy_write_publish.json），暂无法统计发布与收录。</p>';
  var h=[];
  h.push('<h3>发布与收录分析</h3>');
  h.push('<p class="note">'+p.summaryNote+'</p>');
  h.push('<h4>各媒体成功发布数</h4>');
  if(p.mediaBar){ h.push('<div id="c-media" class="g2chart" style="height:'+p.mediaBar.height+'px"></div>'); }
  else { h.push('<p class="note">暂无发布数据。</p>'); }
  h.push('<h4>按媒体分布（含收录篇数）</h4>'+tableHTML(p.mediaRows.head,p.mediaRows.rows));
  h.push('<h4>按日期趋势（含收录篇数）</h4>'+tableHTML(p.dateRows.head,p.dateRows.rows));
  h.push('<h4>今日发布（'+esc(p.today.snap_dt)+'）</h4>');
  if(p.today.rows){ h.push(tableHTML(p.today.rows.head,p.today.rows.rows)); }
  else { h.push('<p class="note">'+p.today.emptyNote+'</p>'); }
  h.push('<h4>文章分析（所有已发布文章）</h4>'+tableHTML(p.articles.rows.head,p.articles.rows.rows));
  h.push('<p class="note">'+p.articles.note+'</p>');
  h.push('<h4>收录情况（发布 → 检测引用闭环）</h4>');
  h.push('<p class="note">'+p.indexSummary+'</p>');
  h.push(p.indexBlock);
  if(p.cross){
    h.push('<h4>收录 → 上榜 归因交叉分析</h4>');
    h.push('<p class="note">'+p.cross.summary+'</p>');
    h.push(tableHTML(p.cross.rows.head,p.cross.rows.rows));
    h.push('<p class="note">'+p.cross.note+'</p>');
  }
  return h.join('');
}

/* 主渲染：根据 window.__REPORT__（data）构建完整项目报告。
 * rootId 默认为 'report-root'；总览内嵌面板传入各自 root。 */
function renderReport(d, rootId){
  var root=document.getElementById(rootId||'report-root');
  if(!root||!d) return;
  var m=d.meta||{};
  var snap=esc(m.snapshot);
  function slot(id){
    if(d.charts && d.charts[id]) return '<div id="'+id+'" class="g2chart" style="height:'+d.charts[id].height+'px"></div>';
    var fb=(d.chartFallbacks&&d.chartFallbacks[id])?d.chartFallbacks[id]:'暂无数据。';
    return '<p class="note">'+fb+'</p>';
  }
  var kpis=(d.kpis||[]).map(function(k){
    return '<div class="kpi '+(k.cls||'')+'"><div class="v">'+esc(k.value)+'</div><div class="l">'+esc(k.label)+'</div></div>';
  }).join('');

  var h=[];
  h.push('<header class="top"><h1>'+esc(m.enterprise)+' · '+esc(m.core_word)+' GEO 检测分析报告</h1>');
  h.push('<div class="sub">生成式引擎优化（GEO）可见性与推荐率专题分析</div>');
  h.push('<div class="meta"><span>报告日期：'+snap+'</span><span>数据跨度：'+esc(m.dates_span)+'（'+m.n_dates+' 天）</span>'
    +'<span>检测样本：'+esc(m.n_records)+' 条</span><span>平台：'+esc((m.platforms||[]).join(' / '))+'</span>'
    +'<span>问句：'+esc(m.n_questions)+' 个</span></div></header>');
  h.push('<div class="kpis">'+kpis+'</div>');
  h.push('<div class="concl">'+ (d.conclusion||'') +'</div>');

  var t=d.trend||{};
  h.push('<section><h2>① 数据汇总</h2>');
  h.push('<h3>推荐率趋势（跨日期聚合）</h3>'+slot('c-trend')+'<p class="note">'+(t.note||'')+'</p>');
  h.push('<h3>平台对比（最新快照 '+snap+'）</h3>'+slot('c-platform'));
  h.push('<h3>分检测日指标总表</h3>'+ (t.byDate?tableHTML(t.byDate.head,t.byDate.rows):'') +'<p class="note">'+(t.byDateNote||'')+'</p>');
  h.push('<h3>问句可见性矩阵（快照 '+snap+'）</h3>'+ (t.matrix?tableHTML(t.matrix.head,t.matrix.rows):'') +'<p class="note">'+(t.matrixNote||'')+'</p>');
  h.push('<h3>AI 引用来源分布（上榜记录）</h3>'+slot('c-cite')+'<p class="note">'+(t.citeNote||'')+'</p>');
  h.push(renderPublish(d.publish||{hasData:false}));
  h.push('</section>');

  h.push('<section><h2>② 关键发现</h2><ul class="findings">'+ (d.findings||[]).map(function(f){return '<li>'+f+'</li>';}).join('') +'</ul></section>');
  h.push('<section><h2>③ 后续建议（按优先级）</h2><ol class="advice">'+ (d.advice||[]).map(function(a){return '<li>'+a+'</li>';}).join('') +'</ol>'
    +'<p class="note">注：相关不等于因果，推荐率变化受发文、竞品、季节、索引生效等多因素共同影响，归因须结合复检持续观察。</p></section>');
  h.push('<footer>'+(d.footer||'')+'</footer>');

  root.innerHTML=h.join('');

  // 图表仅在容器已挂载且可见时渲染（autoFit 才能拿到正确尺寸）
  for(var id in (d.charts||{})){
    if(!d.charts.hasOwnProperty(id)) continue;
    var el=root.querySelector('#'+id);
    if(el) renderChart(d.charts[id], el);
  }
}
</script>
