<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/ant-design-vue/dist/reset.css">
    <title>报告</title>
</head>

<body>
    <div id="app">
        <header id="gao-insight-header">
            <!-- 绑定 header 数据 -->
        </header>
        <div id="gao-insight-fixed-anchor"></div>
        </header>
        <a-card :bordered="false" title="核心指标概览">
            <div id="geo-insight-kpis">
                <!-- 绑定 kpis 数据 -->
            </div>
        </a-card>
        <a-card :bordered="false" title="核心指标概览"></a-card>
        <div id="geo-insight-?"></div>
        <div id="geo-insight-?"></div>
        <div id="geo-insight-?"></div>
        <div id="geo-insight-?"></div>
        <div id="geo-insight-?"></div>
        <div id="geo-insight-?"></div>
        <div id="geo-insight-?"></div>
        <div id="geo-insight-?"></div>
        <div id="geo-insight-?"></div>
        <div id="geo-insight-?"></div>
        <div id="geo-insight-?"></div>
        <div id="geo-insight-?"></div>
        <footer id="geo-insight-footer"></footer>
    </div>
    <script src="https://unpkg.com/@antv/g2/dist/g2.min.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.13/dayjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.13/plugin/customParseFormat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.13/plugin/weekday.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.13/plugin/localeData.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.13/plugin/weekOfYear.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.13/plugin/weekYear.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.13/plugin/advancedFormat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.13/plugin/quarterOfYear.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.13/plugin/relativeTime.js"></script>
    <script src="https://unpkg.com/ant-design-vue/dist/antd.min.js"></script>
    <script>
        const { createApp, ref } = Vue
        // rule: 所有py脚本不要公用任何东西，每个py脚本可以独立运行，由main.py调度
        // header.py脚本读取json文件，转为需要的数据格式，写入.cache/header_data.json: { header: {...} }（如果已存在，直接覆盖内容）
        const header = {}
        // kpis.py脚本读取json文件，转为需要的数据格式，写入.cache/kpis_data.json: { kpis: {...} }（如果已存在，直接覆盖内容）
        const kpis = {}
        // ... 其他维度流程一致
        // 由 insight_read.py读取数据，喂给ai， ai生成写入.cache/insight_data.json格式化洞察数据：{ insight_data: {...} }（如果已存在，直接覆盖内容）
        const insight_data = {}

        // end：上方所有流程结束后，由inject.py读取.cache/*.json，注入到html，完成报告

        const app = createApp({
            setup() {
                return {
                    header,
                    kpis
                }
            }
        })
        app.use(antd).mount('#app')
    </script>
</body>

</html>
